name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      variant:
        description: "Build type"
        type: choice
        options: [debug, release]
        default: debug

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      VARIANT: ${{ inputs.variant || 'debug' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      - name: Generate the native Android project
        run: npx expo prebuild --platform android --no-install --clean

      - name: Make debug builds standalone (bundle the JS into the APK)
        run: |
          sed -i 's|^    // debuggableVariants = \["liteDebug", "prodDebug"\]|    debuggableVariants = []|' android/app/build.gradle
          grep -n "^    debuggableVariants = \[\]" android/app/build.gradle

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew "assemble${VARIANT^}" --no-daemon --stacktrace

      - name: Rename APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/${VARIANT}/*.apk "dist/LastWicketCricket-${VARIANT}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: LastWicketCricket-${{ env.VARIANT }}-apk
          path: dist/*.apk
          if-no-files-found: error

plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ashish.lastcricket'
    compileSdk 34

    defaultConfig {
        applicationId 'com.ashish.lastcricket'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    // No dependencies at all (no AndroidX, no Kotlin) -> smallest possible APK.
}
